<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline Tutor</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div id="app">
    <header id="top-bar">
      <h1>Offline Tutor</h1>
      <label id="subject-label" for="subject">Subject</label>
      <select id="subject">
        <option value="general">General</option>
        <option value="math">Math</option>
        <option value="history">History</option>
      </select>

      <label id="student-label" for="student-select">Student</label>
      <select id="student-select"></select>
      <button id="new-student-btn" type="button">New student</button>
      <form id="new-student-form" hidden>
        <input id="new-student-name" type="text" placeholder="Display name" />
        <input id="new-student-grade" type="number" placeholder="Grade" min="0" />
        <button id="new-student-create" type="submit">Create</button>
      </form>

      <button id="new-lesson-btn" type="button">New lesson</button>
      <label id="lesson-resume-label" for="lesson-resume-list">Resume lesson</label>
      <select id="lesson-resume-list"></select>
    </header>

    <main id="main-area">
      <section id="chat-pane">
        <div id="chat" role="log" aria-live="polite"></div>

        <div id="action-bar">
          <button id="btn-simpler" type="button" data-action="simpler">Simpler</button>
          <button id="btn-deeper" type="button" data-action="deeper">Deeper</button>
          <button id="btn-hint" type="button" data-action="hint">Hint</button>
          <button id="btn-research" type="button" data-action="research_this">Research this</button>
        </div>

        <form id="composer">
          <textarea id="input" rows="2" placeholder="Ask a question..."></textarea>
          <button id="send" type="submit">Send</button>
          <button id="stop" type="button">Stop</button>
        </form>
      </section>

      <aside id="side-pane">
        <section id="source-viewer" aria-label="Source viewer">
          <h2>Source</h2>
          <div id="source-viewer-body">
            <p id="source-empty">Select a citation to see its source.</p>
          </div>
        </section>

        <section id="status-panel" aria-label="Status">
          <h2>Status</h2>
          <dl id="status-panel-body"></dl>
        </section>

        <section id="attribution-legend" aria-label="Attribution legend">
          <h2>Legend</h2>
          <ul>
            <li><span class="attribution-marker attribution-backed" aria-hidden="true">&#9679;</span> source-backed</li>
            <li><span class="attribution-marker attribution-unbacked" aria-hidden="true">&#9675;</span> the tutor's own words -- not checked against the library</li>
            <li><span class="attribution-marker attribution-unbacked-number" aria-hidden="true">&#9888;</span> number not found in the library</li>
            <li><span class="attribution-marker attribution-computed-verified" aria-hidden="true">&#10003;</span> computed -- checked by the calculator</li>
          </ul>
        </section>
      </aside>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
