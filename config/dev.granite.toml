# Dev config: IBM Granite 4.0 H-Tiny (hybrid Mamba-2/attention MoE, ~7B
# total / ~1B active) bake-off on the Radeon Pro 5500M 8GB (Vulkan).
# Copied from config/dev.toml; runtime_dir unchanged (llama-server.exe and
# DLLs still come from the Bonsai checkout), model_path points at the
# Granite GGUF fetched into this repo's own runtime/models/.
# See docs/bakeoff_dev/granite_flags.md for the sweep and chosen flags.
# NOTE: config/dev.toml is now this same Granite profile (Task 1, Granite
# became the default dev config); this file is kept identical so existing
# references to it keep working.

[runtime]
runtime_dir = 'C:\git\bonsai'
model_path = 'C:\git\kiwix-ai-tutor\runtime\models\granite-4.0-h-tiny\granite-4.0-h-tiny-Q4_K_M.gguf'
server_binary = "bin/llama-server.exe"

[server]
host = "127.0.0.1"
port = 8080
ctx_size = 32768
cache_type_k = "q8_0"
cache_type_v = "q8_0"
n_gpu_layers = 99
parallel = 1
flash_attn = true
# Chosen after the Vulkan flag sweep (docs/bakeoff_dev/granite_flags.md):
# flash_attn=true + q8_0/q8_0 KV is REQUIRED to fit 32K ctx in <=5.6 GiB
# (llama-bench: -ctk/-ctv q8_0 without -fa 1 refuses to create the context
# on this build -- quantized KV needs flash attention). Measured: pp512
# 683 t/s @ d0 / 387 t/s @ d4096, tg64 67.4 t/s @ d0 / 63.9 t/s @ d4096,
# 5751201792 B (~5.36 GiB) total VRAM at 32K via GPU Adapter Memory
# counter -- comfortably under the 6 GiB delivery-machine budget and far
# above the ~15 t/s decode floor. Default ubatch (512, matches
# llama-server's own default) beat 256 in the sweep and needed no extra
# flag, so extra_args is unused here.
jinja = true
slots = true

[sampling]
temperature = 0.5
top_p = 0.9
top_k = 20

[app]
host = "127.0.0.1"
port = 8420
data_dir = "data"
registry_path = "config/archives.dev.toml"

# Dense sidecar left disabled for this bake-off: focus is the chat model.
[embedding]
host = "127.0.0.1"
port = 8081
model_path = 'C:\git\kiwix-ai-tutor\runtime\models\embedding.gguf'
dim = 384
n_gpu_layers = 0
threads = 4
ctx_size = 512
sidecar_dir = "runtime/simplewiki_dense"
archive_id = "simplewiki"
enabled = false
