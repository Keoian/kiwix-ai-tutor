# Dev config: Ternary-Bonsai-8B (dense 8B transformer, 36 layers / 8 KV
# heads, ternary/1-bit-family quantization) bake-off on the Radeon Pro
# 5500M 8GB (Vulkan). Copied from config/dev.granite.toml; runtime_dir
# unchanged (llama-server.exe and DLLs still come from the Bonsai
# checkout), model_path points at the Ternary GGUF fetched into this
# repo's own runtime/models/.
# See docs/bakeoff_dev/ternary_flags.md for the sweep and chosen flags.
# KV cache is LARGE for this model (~72 KiB/token at q8_0, ~2.4 GiB at
# 32K) because it is a dense 36-layer/8-KV-head transformer, unlike
# Granite's hybrid Mamba-2 architecture -- this bake-off is about finding
# the best fa/KV-type/ubatch/context trade-off given that.

[runtime]
runtime_dir = 'C:\git\bonsai'
model_path = 'C:\git\kiwix-ai-tutor\runtime\models\ternary-bonsai-8b\Ternary-Bonsai-8B-Q2_0_g64.gguf'
server_binary = "bin/llama-server.exe"

[server]
host = "127.0.0.1"
port = 8080
ctx_size = 16384
cache_type_k = "f16"
cache_type_v = "f16"
n_gpu_layers = 99
parallel = 1
flash_attn = false
extra_args = ["-ub", "128"]
jinja = true
slots = true
# Chosen after the Vulkan flag sweep (docs/bakeoff_dev/ternary_flags.md):
# Ternary-Bonsai-8B-Q2_0.gguf (legacy Prism group-128 packing) does NOT
# load on this build; both Ternary-Bonsai-8B-PQ2_0.gguf and
# Ternary-Bonsai-8B-Q2_0_g64.gguf load fine on Vulkan -- g64 was faster
# (pp64 221 vs 160 t/s) and was kept. fa=0/f16-KV beats fa=1/q8_0-KV on
# prefill at depth for this dense 36-layer model (pp@d4096 ~55-175 vs
# ~24-29 t/s; fa=1's pp@d8192 exceeded 4 min outright, matching the known
# flash-attn-collapses-with-depth pathology on this GPU), and the app's
# steady-state turns only prefill ~0.5-1.5k NEW tokens at depth thanks to
# prompt caching, so prefill-at-depth dominates the real workload more
# than raw decode t/s does. f16 KV is required for fa=0 on this build, and
# f16 KV at 32K (~4.8 GiB) would not fit under the 5.6 GiB cap alongside
# this ~2.15 GiB model, so ctx_size is cut to 20480 to fit; ub=128 was the
# best fa=0 ubatch in the sweep (best d8192 numbers, competitive elsewhere).

[sampling]
# No model-specific sampling recommendation found in the GGUF metadata /
# chat template; using the same defaults as the Granite bake-off.
temperature = 0.5
top_p = 0.9
top_k = 20

[app]
host = "127.0.0.1"
port = 8420
data_dir = "data"
registry_path = "config/archives.dev.toml"

# Dense sidecar left disabled for this bake-off: focus is the chat model.
[embedding]
host = "127.0.0.1"
port = 8081
model_path = 'C:\git\kiwix-ai-tutor\runtime\models\embedding.gguf'
dim = 384
n_gpu_layers = 0
threads = 4
ctx_size = 512
sidecar_dir = "runtime/simplewiki_dense"
archive_id = "simplewiki"
enabled = false
