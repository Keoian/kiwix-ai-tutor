# Dev config (default since 2026-09-21): inclusionAI Ling 3.0 Tiny (7.9B
# total / 1.3B active MoE, hybrid linear attention, MIT licence), bartowski
# Q4_K_M GGUF quantisation, thinking switched OFF at the server (owner
# decision: "Let's set default to Ling"). Granite 4.0 H-Tiny remains
# available as config/dev.granite.toml (the prior default); Bonsai-8B
# Q1_0 as config/dev.bonsai-q1.toml. Identical to config/dev.ling.toml
# apart from this comment -- both are kept so existing commands that
# name either file keep working.
#
# NOT VERIFIED: fit and speed on the delivery laptop (GTX 1060 Max-Q,
# 6 GB VRAM) -- all measurements below are from this dev machine only.
# Measured here (this session, 2026-09-21): ~4.63 GiB model share of
# VRAM at 32K context, ~25 tok/s writing (generation), ~40-200 tok/s
# reading (prompt processing, varies with depth).

[runtime]
runtime_dir = 'C:\git\bonsai'
model_path = 'C:\git\kiwix-ai-tutor\runtime\models\ling-3.0-tiny\Ling-3.0-tiny-Q4_K_M.gguf'
server_binary = "bin/llama-server.exe"

[server]
host = "127.0.0.1"
port = 8080
ctx_size = 32768
cache_type_k = "q8_0"
cache_type_v = "q8_0"
n_gpu_layers = 99
parallel = 1
flash_attn = true
jinja = true
# Thinking off: a tutor turn must not spend hundreds of hidden tokens first.
# --reasoning-budget 0 only: a JSON --chat-template-kwargs value loses its quotes when
# Windows PowerShell 5.1 passes it to a native exe (scripts/serve_dev.ps1), and the server refuses to start.
extra_args = ["--reasoning-budget", "0"]
slots = true

[sampling]
temperature = 0.7
top_p = 0.95
top_k = 20

[app]
host = "127.0.0.1"
port = 8420
data_dir = "data"
registry_path = "config/archives.dev.toml"
answer_max_tokens = 2000

[embedding]
host = "127.0.0.1"
port = 8081
model_path = 'C:\git\kiwix-ai-tutor\runtime\models\embedding.gguf'
dim = 384
n_gpu_layers = 0
threads = 4
ctx_size = 512
sidecar_dir = "runtime/simplewiki_dense"
archive_id = "simplewiki"
enabled = false
