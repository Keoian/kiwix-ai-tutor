# Dev config for running llama-server against the local Bonsai runtime.
# runtime_dir is a machine-local path to the (read-only, non-repo) model/binary
# checkout; it is a literal TOML string so backslashes are not escape sequences.
# Mirrors C:\git\bonsai\start-server-32k.ps1 -> start-server.ps1 (32k ctx, q8_0 KV cache).

[runtime]
runtime_dir = 'C:\git\bonsai'
model_path = "models/Bonsai-8B-Q1_0.gguf"
server_binary = "bin/llama-server.exe"

[server]
host = "127.0.0.1"
port = 8080
ctx_size = 32768
cache_type_k = "q8_0"
cache_type_v = "q8_0"
n_gpu_layers = 99
parallel = 1
flash_attn = true
jinja = true
slots = true

[sampling]
temperature = 0.5
top_p = 0.9
top_k = 20

[app]
host = "127.0.0.1"
port = 8420
data_dir = "data"
registry_path = "config/archives.dev.toml"

# WP-B7: dense sidecar embedding server. Runs as a SECOND llama-server
# (scripts/serve_embed.*) on its own port, alongside (not instead of) the
# chat server above. model_path resolves against [runtime].runtime_dir the
# same way [runtime].model_path does. dim must match the model's actual
# output dimension (384 for the small embedding GGUFs this WP targets).
[embedding]
host = "127.0.0.1"
port = 8081
# Absolute path: this model lives in the repo's own runtime/models/ (fetched
# for the WP-B7 live sample), not under [runtime].runtime_dir (the Bonsai
# chat-model checkout) -- a relative path here would resolve against the
# wrong directory. bge-small-en-v1.5 Q8_0 GGUF, 384-dim, ~37 MB.
model_path = 'C:\git\kiwix-ai-tutor\runtime\models\embedding.gguf'
dim = 384
